# TEMP(xmpp-support): fast debug-APK lane for on-device iteration. Assembles ONLY the FOSS debug
# APK (no tests, lint, schema verify, or emulator E2E) so a build is available in a few minutes;
# the full ci.yml still runs in parallel as the real gate. Removed before merge.
name: Fast debug APK (TEMP)
on:
  push:
    branches: [xmpp-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Assemble FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --build-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motd-debug-fast
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
