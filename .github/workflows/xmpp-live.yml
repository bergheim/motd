# TEMP(xmpp-support): manually-dispatched live XMPP verification against the
# maintainer's ejabberd, credentials via repo secrets. Removed before merge.
name: XMPP live tests (TEMP)
on: workflow_dispatch

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Run live XMPP tests
        env:
          MOTD_XMPP_LIVE_DOMAIN: ${{ secrets.MOTD_XMPP_LIVE_DOMAIN }}
          MOTD_XMPP_LIVE_USER1: ${{ secrets.MOTD_XMPP_LIVE_USER1 }}
          MOTD_XMPP_LIVE_PASS1: ${{ secrets.MOTD_XMPP_LIVE_PASS1 }}
          MOTD_XMPP_LIVE_USER2: ${{ secrets.MOTD_XMPP_LIVE_USER2 }}
          MOTD_XMPP_LIVE_PASS2: ${{ secrets.MOTD_XMPP_LIVE_PASS2 }}
        run: >-
          ./gradlew :app:testFossDebugUnitTest
          --tests "io.github.trevarj.motd.xmpp.XmppLiveTest"
          --stacktrace
      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xmpp-live-report-${{ github.run_id }}
          path: app/build/reports/tests/testFossDebugUnitTest/**
          if-no-files-found: ignore
